<script>
(function(){
  var q=document.getElementById('q'), none=document.getElementById('none');
  var rows=[].slice.call(document.querySelectorAll('tr[data-q]'));
  var els=[].slice.call(document.querySelectorAll('.hl'));
  els.forEach(function(e){e.setAttribute('data-t',e.textContent);});
  function norm(s){s=s.toLowerCase();return s.normalize?s.normalize('NFKC'):s;}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var idx=rows.map(function(r){return norm(r.getAttribute('data-q'));});
  /* 検索語に一致した部分を <mark> で囲む (全角/半角・大文字/小文字を区別しない) */
  function hl(text,words){
    if(!words.length) return esc(text);
    var n='',map=[],i,k,c,mk=[];
    for(i=0;i<text.length;i++){c=norm(text.charAt(i));for(k=0;k<c.length;k++){n+=c.charAt(k);map.push(i);}}
    words.forEach(function(w){
      var p=0,j;
      while((j=n.indexOf(w,p))>=0){for(k=j;k<j+w.length;k++)mk[map[k]]=true;p=j+w.length;}
    });
    var out='',inm=false,m;
    for(i=0;i<text.length;i++){
      m=!!mk[i];
      if(m&&!inm){out+='<mark>';inm=true;}else if(!m&&inm){out+='</mark>';inm=false;}
      out+=esc(text.charAt(i));
    }
    return inm?out+'</mark>':out;
  }
  function run(){
    var words=norm(q.value).split(/\s+/).filter(Boolean), n=0;
    rows.forEach(function(r,i){
      var ok=words.every(function(w){return idx[i].indexOf(w)>=0;});
      r.hidden=!ok; if(ok)n++;
    });
    els.forEach(function(e){e.innerHTML=hl(e.getAttribute('data-t'),words);});
    none.hidden=n>0;
  }
  /* 検索語をURL(?q=...)に反映し、URLに ?q= があればその検索状態で開く。
     テキスト一覧/画像付き一覧の切り替えリンクにも検索語を引き継ぐ */
  var vlinks=[].slice.call(document.querySelectorAll('.views a'));
  vlinks.forEach(function(a){a.setAttribute('data-href',a.getAttribute('href'));});
  function sync(){
    var v=q.value;
    vlinks.forEach(function(a){
      a.setAttribute('href',a.getAttribute('data-href')+(v?'?q='+encodeURIComponent(v):''));
    });
    try{
      var u=new URL(location.href);
      if(v)u.searchParams.set('q',v);else u.searchParams.delete('q');
      if(u.href!==location.href)history.replaceState(null,'',u.href);
    }catch(e){}
  }
  q.addEventListener('input',function(){run();sync();});
  try{q.value=new URL(location.href).searchParams.get('q')||'';}catch(e){}
  run();
  sync();
})();
</script>
