<p class="site-nav"><a href="../../../../index.html">← 晴歩雨描</a></p><article><h1>神戸ギャラリーめぐり：谷守佳代、鄭相和、浦島晶子</h1><p class="meta">2017-06-22 · <a href="../../../../category/c5.html">アート・美術</a> <a href="../../../../category/c33.html">神戸</a></p><div class="entry-body"><p>6月22日。今日は神戸、元町、三宮、王子公園のギャラリーめぐり。結構すばらしい作品展がいくつもあった。特に、次の3つが良かった。</p>
<p>■トアロード画廊：谷守佳代（油絵）</p>
<p>■ギャラリー開：鄭相和（<a class="keyword" href="http://d.hatena.ne.jp/keyword/%CC%DA%C8%C7%B2%E8">木版画</a>）</p>
<p>■ギャラリー<a class="keyword" href="http://d.hatena.ne.jp/keyword/%CB%CC%CC%EE%BA%E4">北野坂</a>：浦島晶子（陶器）</p>
<p>浦島晶子展では、小さな作品が手頃な値段だったので買ってしまった。</p>
