<p class="site-nav"><a href="../../../../index.html">← 晴歩雨描</a></p><article><h1>大阪）和泉リサイクル環境公園の梅林</h1><p class="meta">2017-02-28 · <a href="../../../../category/c7.html">ウォーキング・散策</a> <a href="../../../../category/c35.html">花・植物</a> <a href="../../../../category/c29.html">梅（ウメ）</a></p><div class="entry-body"><p>2月25日、和泉リサイクル環境公園の梅を見に行ってきた。</p>
<p>産業廃棄物埋立跡地を利用した所らしいが、枝垂れの梅が多く、期待以上にきれい。</p>
<p>公共<a class="keyword" href="http://d.hatena.ne.jp/keyword/%B8%F2%C4%CC%B5%A1%B4%D8">交通機関</a>で行く場合、泉北高速線<a class="keyword" href="http://d.hatena.ne.jp/keyword/%CF%C2%C0%F4%C3%E6%B1%FB%B1%D8">和泉中央駅</a>から<a class="keyword" href="http://d.hatena.ne.jp/keyword/%C6%EE%B3%A4%A5%D0%A5%B9">南海バス</a>で納花（のうけ）というバス停で降りて10分程歩くのだが、歩道のない狭い道路の割に交通量が多く歩きづらいのが難点。</p>
