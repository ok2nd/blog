<p class="site-nav"><a href="../../../../index.html">← 晴歩雨描</a></p><article><h1>2017神戸CWAJ版画展</h1><p class="meta">2017-11-15 · <a href="../../../../category/c5.html">アート・美術</a> <a href="../../../../category/c6.html">イベント</a> <a href="../../../../category/c33.html">神戸</a></p><div class="entry-body"><p>11月15日から19日まで、神戸北野にある神戸倶楽部で「2017神戸CWAJ版画展」が開催されている。</p>
<p>作品はどれも素晴らしかったが、2年前の前回と比べると会場スペースが数分の一になり展示作品も少なかったのが残念。</p>
<p>日本版画協会の版画展が、2011年の第79回展は京都で開催されたらしいが、その後東京でしか開催されていない。たまには関西でもやってほしい。</p>
