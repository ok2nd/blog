<p class="site-nav"><a href="../../../../index.html">← 晴歩雨描</a></p><article><h1>京都宝ヶ池公園→深泥池→京都府立植物園。ショウジョウトンボ、ハラビロトンボ（？）。</h1><p class="meta">2018-06-09 · <a href="../../../../category/c12.html">ハイキング</a> <a href="../../../../category/c14.html">マップ付</a> <a href="../../../../category/c35.html">花・植物</a> <a href="../../../../category/c15.html">京都</a> <a href="../../../../category/c19.html">動物・昆虫・魚</a></p><div class="entry-body"><p>6月9日。京都市地下鉄国際会館駅→宝ヶ池公園→深泥池→京都府立植物園。8.5km。3時間30分。</p>
<p>宝ヶ池公園には何故か野生の鹿が。深泥池にはトンボがたくさん。京都府立植物園では、ハナショウブ、バラ他たくさんの花が咲いていた。アジサイは咲始め。</p>
