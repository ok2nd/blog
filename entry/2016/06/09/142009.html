<p class="site-nav"><a href="../../../../index.html">← 晴歩雨描</a></p><article><h1>ギャラリーで絵を買った。</h1><p class="meta">2016-06-09 · <a href="../../../../category/c5.html">アート・美術</a></p><div class="entry-body"><p>昨日、三宮のギャラリー巡りをしていたら、GALLERY北野坂の山田洋子作品展で、6.5cm×7cmの小さな作品ながらあまりにも安い価格設定の作品があったので思わず買ってしまった。かわいい<a class="keyword" href="http://d.hatena.ne.jp/keyword/%A5%A4%A1%BC%A5%BC%A5%EB">イーゼル</a>も付いて1200円だった。</p>
<p>山田洋子作品展全体としては大きな作品がメインで、自分には絶対描けないような丁寧に描かれた素晴らしい作品がたくさんあった。</p>
